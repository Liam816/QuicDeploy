# Recorder IK with deployment joint caps: 30 deg/s and 180 deg/s².
# Encoder tracking error is logged; the deployment bundle may disable its abort limit.
version: 1
model:
  urdf_path: /home/ih/workspace/yihuigou/teleop_platform_xk/src/vr_teleop/ik/piper/IK_version1.0/models/generated/piper_bimanual.urdf
  root_frame: arm_origin
  # Native API calls these tcp_frames; the controlled frames are the wrists.
  tcp_frames: [left_Link6, right_Link6]
  shoulder_frames: [left_base_link, right_base_link]
  elbow_frames: [left_Link3, right_Link3]
  collision_pairs:
    - [left_base_link_0, right_base_link_0]
  controlled_joints:
    - left_joint1
    - left_joint2
    - left_joint3
    - left_joint4
    - left_joint5
    - left_joint6
    - right_joint1
    - right_joint2
    - right_joint3
    - right_joint4
    - right_joint5
    - right_joint6
ik:
  check_collisions: false
  dt: 0.02  # control_hz = 50; deployment configuration only
  position_gain: 6.0
  orientation_gain: 6.0
  position_weight: 1.0
  orientation_weight: 0.50
  damping: 0.001  # fallback nominal QP diagonal for unlisted joints
  # Deployment extension only; recording uses its original YAML and library.
  joint_damping:
    left_joint1: 0.04
    right_joint1: 0.04
  smoothing_weight: 0.01
  posture_weight: 0.001
  posture_gain: 0.2
  elbow_weight: 0.005
  elbow_gain: 0.3
  elbow_minimum_outward_offset: 0.04
  elbow_outward_directions:
    - [0.0, 1.0, -1.0]
    - [0.0, -1.0, -1.0]
  singularity_soft_threshold: 1.0e-9
  singularity_hard_threshold: 0.0
  singularity_damping_max: 0.001
  nullspace_svd_tolerance: 0.000001
  manipulability_weight: 0.001
  manipulability_gain: 0.10
  manipulability_fd_step: 0.0001
  manipulability_update_period: 20
  max_linear_speed: 1.35
  max_angular_speed: 3.375
  joint_margin: 0.0
  joint_limit_lookahead_s: 0.10
  check_measured_braking_feasibility: false
  safe_distance: 0.02
  activation_distance: 0.08
  collision_query_distance: 0.12
  collision_monitor_period_ms: 100
  collision_snapshot_timeout_ms: 250
  collision_uncertainty_margin: 0.005
  barrier_gain: 5.0
  velocity_cap: 0.5235987755982988
  acceleration_cap: 3.1415926535897931
  feedback_velocity_tolerance: 0.001
  max_reference_tracking_error: 1.3962634
  trajectory_check_substeps: 5
session:
  input_timeout_ms: 100
  feedback_timeout_ms: 50
  computation_budget_ms: 30
  command_validity_ms: 40
  startup_position_tolerance: 0.02
  startup_orientation_tolerance: 0.10
initial_positions:
  left_joint1: 0.00000000
  left_joint2: 0.69813170
  left_joint3: -0.87266463
  left_joint4: 0.69813170
  left_joint5: 0.00000000
  left_joint6: 0.00000000
  right_joint1: 0.00000000
  right_joint2: 0.69813170
  right_joint3: -0.87266463
  right_joint4: 0.69813170
  right_joint5: 0.00000000
  right_joint6: 0.00000000
