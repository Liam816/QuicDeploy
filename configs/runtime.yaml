# QuicInfer runtime parameters. Relative paths are relative to this file; restart to apply.
# QuicInfer 运行参数。相对路径以本文件所在目录为基准；修改后重启生效。
# This file is the single source of truth: every key below is required (except
# guard.gripper_binary_thresholds_mm) and unknown keys are rejected.
# 本文件是唯一参数来源：除 guard.gripper_binary_thresholds_mm 外全部为必填项，未知键会被拒绝。
schema_version: 1

hardware: hardware/piper_x/hardware.yaml
# Model card; `--model configs/models/<card>.json` overrides it on the command line.
# 模型卡；命令行 --model 可临时覆盖。
model: models/lva_rotating_box_ep050_fp16.json

runtime:
  device: cuda                 # live deployment requires cuda / 实机部署必须为 cuda
  cpu_threads: 4

# Camera/joint alignment budgets, head camera is the time reference (ms).
# 相机与关节对齐预算，以头部相机为时间基准（毫秒）。
observation:
  max_camera_age_ms: 100
  max_camera_skew_ms: 50
  max_joint_age_ms: 50

execution:
  # sync: hold-infer-play; async: prefetching queue; rtc: legacy name for async + prefix.
  # sync：停-推-播；async：异步预取队列；rtc：异步 + 固定前缀的历史名称。
  mode: async
  # RTC prefix rows: 0 disables RTC, 1..fixed_prefix_steps enables it (async/rtc only).
  # RTC 前缀行数：0 关闭，1..模型 fixed_prefix_steps 开启（仅 async/rtc）。
  prefix_steps: 10
  control_hz: 50               # IK + MIT command rate / IK 与 MIT 指令频率
  policy_hz: 30                # action row playback rate, equals training / 动作播放频率，与训练一致
  policy_overclock_enabled: false
  n_action_steps: 40           # rows executed per chunk / 每块执行的行数
  # Next request fires when this many rows remain; must be >= prefix_steps; 0 for sync.
  # 剩余这么多行时发起下一次推理；必须 >= prefix_steps；sync 模式为 0。
  prefetch_remaining_steps: 15
  handoff_margin_s: 0.011
  max_inference_wait_s: 15.0
  max_tick_lateness_s: 0.020
  late_policy: hold            # hold: pause on overrun; fail: stop / hold 超时暂停；fail 直接停止
# Prefix rows (1-based) = n_action_steps - prefetch_remaining_steps + [1 .. prefix_steps].
# 前缀行号（1 起） = n_action_steps - prefetch_remaining_steps + [1 .. prefix_steps]。
# For sync use: prefetch_remaining_steps: 0, prefix_steps: 0, blend_s: 0.0.
# 切换 sync 时请同时设置：prefetch_remaining_steps: 0、prefix_steps: 0、blend_s: 0.0。

# Seconds. Lead compensation is currently disabled.
# 单位秒；当前未启用跟随延迟（超前）补偿。
postprocess:
  blend_s: 0.1                 # cross-fade window between chunks / 新旧块融合窗口
  arm_delay_s: 0.0
  gripper_delay_s: 0.0

# Final joint command guard: deg, deg/s, mm, mm/s. IK-internal limits: hardware/piper_x/ik.yaml.
# 最终关节指令保护：度、度/秒、毫米、毫米/秒。IK 内部速度/加速度限制见 hardware/piper_x/ik.yaml。
guard:
  joint_limits_deg:            # J1..J6, shared by both arms / 左右臂共用
    - [-154, 154]
    - [-7, 186]
    - [-177, 7]
    - [-97, 97]
    - [-97, 97]
    - [-186, 186]
  gripper_widths_mm: [70, 100]           # left, right / 左、右
  # Above threshold -> fully open, else closed; null disables. / 大于阈值全开，否则全闭；null 关闭。
  gripper_binary_thresholds_mm: [40, 75]
  # null: send bounded targets directly (as teleop); number: extra software rate limit.
  # null：与遥操作一样直接发送限幅目标；数值：额外的软件限速。
  gripper_speed_mm_s: null
  max_tracking_error_deg: null           # null: log only / null 只记录不中止
  max_joint_speed_deg_s: 135
  gripper_feedback_tolerance_mm: 0.5

# Held-inference stillness checks. / 静止推理期间的静止性检查。
hold:
  max_hold_drift_deg: 1
  max_hold_image_change: 0.04

# Reject chunks that move a wrist too far from the anchor. / 拒绝手腕偏离锚点过远的动作块。
motion_limits:
  max_chunk_displacement_m: 0.6
  max_chunk_rotation_deg: 75
